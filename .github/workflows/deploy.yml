name: Public CI

on:
  push:
    branches: [ main, master, dev, public ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test
      HEADER_FOR_AUTH_SERVER: nebula-rest-api
      APP_JWT_SECRET: VGhpc0lzQVB1YmxpY1ByZXZpZXdKV1RTZWNyZXRGb3JUZXN0aW5nT25seTEyMzQ1Njc4OTA=
      APP_RESOURCES_BASE_URL: https://cdn.example.com/resources/nebula/
      CORS_ALLOWED_ORIGIN_PATTERNS: https://app.example.com,https://*.app.example.com
      IMAGE_AVATAR_PATH: /tmp/nebula/avatars
      NEBULA_DB_URL: jdbc:mariadb://localhost:3306/nebula
      NEBULA_USERNAME: nebula
      NEBULA_PASSWORD: nebula
      NEBULA_TEST_DB_URL: jdbc:mariadb://localhost:3306/nebula_test
      NEBULA_TEST_USERNAME: nebula
      NEBULA_TEST_PASSWORD: nebula
      ANDROMEDA_AUTH_SERV_URL: https://auth.example.com/andromeda
      ANDROMEDA_AUTH_SERV_TEST_URL: https://auth-test.example.com/andromeda

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Prepare local environment file for tests
        run: |
          mkdir -p "$IMAGE_AVATAR_PATH"
          cat <<EOF > .env
          ANDROMEDA_AUTH_SERV_URL=${ANDROMEDA_AUTH_SERV_URL}
          ANDROMEDA_AUTH_SERV_TEST_URL=${ANDROMEDA_AUTH_SERV_TEST_URL}
          APP_JWT_SECRET=${APP_JWT_SECRET}
          APP_RESOURCES_BASE_URL=${APP_RESOURCES_BASE_URL}
          CORS_ALLOWED_ORIGIN_PATTERNS=${CORS_ALLOWED_ORIGIN_PATTERNS}
          HEADER_FOR_AUTH_SERVER=${HEADER_FOR_AUTH_SERVER}
          IMAGE_AVATAR_PATH=${IMAGE_AVATAR_PATH}
          NEBULA_DB_URL=${NEBULA_DB_URL}
          NEBULA_USERNAME=${NEBULA_USERNAME}
          NEBULA_PASSWORD=${NEBULA_PASSWORD}
          NEBULA_TEST_DB_URL=${NEBULA_TEST_DB_URL}
          NEBULA_TEST_USERNAME=${NEBULA_TEST_USERNAME}
          NEBULA_TEST_PASSWORD=${NEBULA_TEST_PASSWORD}
          EOF

      - name: Run unit and slice tests
        run: ./mvnw -B test -DtrimStackTrace=false

      - name: Package application artifact
        run: ./mvnw -B -DskipTests package

      - name: Generate build metadata
        run: |
          WAR_FILE=$(ls target/*.war | head -n 1)
          sha256sum "$WAR_FILE" > "$WAR_FILE.sha256"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: target/site/jacoco/

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-rest-api-package
          path: |
            target/*.war
            target/*.war.sha256
